# The installer's and the site's checks on every PR and on main: shellcheck, and installer/test.sh (A17's installer half: the release
# verification, the baked digest, the setup handover) under sh and dash. On GitHub-hosted runners.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      # shellcheck v0.11.0 (2025-08-04), the static release binary, checked by sha256, when the runner has none.
      - name: shellcheck
        run: |
          sc=shellcheck
          if ! command -v shellcheck >/dev/null; then
            curl -fsSL -o "$RUNNER_TEMP/sc.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
            echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
            # The runner image has no xz: Python's lzma unpacks it.
            python3 -c 'import lzma, sys, tarfile; tarfile.open(fileobj=lzma.open(sys.argv[1])).extractall(sys.argv[2], filter="data")' "$RUNNER_TEMP/sc.tar.xz" "$RUNNER_TEMP"
            sc="$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck"
          fi
          "$sc" --version | head -2
          "$sc" install.sh installer/test.sh .github/release/test-set.sh .github/release/upgrade.sh .github/release/graduate-instance.sh
      - run: sh installer/test.sh
      - run: if command -v dash >/dev/null; then dash installer/test.sh; else echo "no dash on this runner"; fi
      - run: node --check .github/release/suites.mjs && node --check .github/release/graduate-scenario.mjs && node --check .github/release/graduate-checks.mjs
      - run: node --test .github/release/graduate.test.mjs
      # release.yml runs on these runners too: the tools it needs are here.
      - name: Release tools on this runner
        run: for t in git jq python3 sha256sum curl base64 cmp; do command -v "$t" >/dev/null || { echo "::error::no $t on this runner (release.yml needs it)"; exit 1; }; done; git --version
  # The site build and its share/SEO check (web/check-site.mjs): every page's title, description, canonical, Open Graph
  # and Twitter tags, the og:image file, JSON-LD, headings, internal links, markdown twins and the sitemap.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: sh web/build.sh
      - run: node --test web/worker.test.mjs
