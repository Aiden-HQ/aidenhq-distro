# Cut a release (lean-core spec §6.8): push a tag `<release>` (2026.11.18, 2026.11.18.1) on a main commit whose
# releases/<release>.json names a real product sha (`kernel`: the product commit, whose modules/ tree is the official
# modules). On GitHub-hosted runners, this installs exactly that set (install.sh's own fetch and verify), checks the kernel is on product main with its CI green there, checks the last release's install upgrades to it and, in a separate, advisory job, what its AI reviewer says of the update (.github/release/upgrade.sh), writes `tested`, bakes the file's sha256 and the tag's commit into install.sh, and
# publishes both as the release's assets: https://github.com/Aiden-HQ/aidenhq-distro/releases/download/<release>/install.sh.
# Prebuilt images: the release file may carry `images` (name -> ghcr.io/aiden-hq/<name>@sha256:<digest>), which apply pulls
# instead of building. The apply reads the release file from git at the pinned commit, so the digests are in the file before
# the tag: run this workflow by hand first (Actions > release > Run workflow, release = the name), which builds every image
# the release's product checkout (its kernel and its modules/) builds locally for amd64 and arm64 (only the ones whose content key, .github/release/image-key.mjs, isn't in the registry yet; each platform on its native runner), pushes them, and prints the `images` block (and keeps it
# as the `images.json` artifact) to paste into releases/<release>.json. The tag run then checks that each digest is there for
# both platforms and names an image this release builds. A release file without `images` installs by building, as before.
# RELEASE_READ_TOKEN (contents: read) is optional: only a private product repo needs it; public repos fetch
# anonymously, and an unset secret gives the fetch no token.
# A tag run is a push of the tag, or this workflow dispatched on the tag (Run workflow, "Use workflow from" = the tag; the
# nightly does this, since a tag it pushes with GITHUB_TOKEN starts no workflow). Any other run builds images.
# The nightly (nightly.yml) calls this workflow (workflow_call) for plan/images/collect with its release file as `manifest`,
# then lands the file with the images on main, tags it and dispatches the tag run.
# A tag run that doesn't publish deletes its tag and any draft release, and opens an issue (`alert`), so installs never see an
# untested release. Publishing makes a pre-release, never "latest": installs' updaters skip it and get.aidenhq.ai (GitHub's
# latest, web/worker.js) keeps serving the graduated release. graduate.yml upgrades a test instance to it and only then makes
# it a full release and latest (README "Release graduation").
# Isolation: the test job's upgrade step is the only one that runs fetched code, and it has no token; publish is a separate
# job (needs: test), so it lands on a fresh runner that never ran fetched code.
name: release
on:
  push:
    tags: ["20[0-9][0-9].[0-9]*"]
  workflow_dispatch:
    inputs:
      release:
        description: "On a branch: build and push the images of releases/<name>.json (e.g. 2026.11.18). On a tag: leave empty, the tag is the release."
        required: false
  workflow_call:
    inputs:
      release:
        type: string
        required: true
      # The release file itself, when it isn't on this commit yet (the nightly's).
      manifest:
        type: string
        required: false
    secrets:
      RELEASE_READ_TOKEN:
        required: false
permissions: {}
concurrency: release-${{ github.ref_type == 'tag' && github.ref_name || inputs.release }}-${{ github.ref_type }}
jobs:
  # Fetch and test with a read-only token; publishing is a separate job, the only one that can write.
  test:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Node 24 is in the runner image's tool cache: found there, nothing is downloaded.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: The tag is on main and its release file names a real product sha
        run: |
          [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{1,2}(\.[0-9]+){0,2}$ ]] || { echo "::error::$TAG isn't a release name (2026.11.18, 2026.11.18.1)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG isn't on main"; exit 1; }
          f="releases/$TAG.json"
          [ -f "$f" ] || { echo "::error::no $f"; exit 1; }
          jq -e --arg t "$TAG" '
            def sha: type == "string" and test("^[0-9a-f]{40}$");
            .release == $t and (.kernel | sha) and ((.kernel_repo // "x/y") | type == "string" and test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"))
            and (has("marketplace") or has("modules") | not)
            and ((.notes // []) | type == "array" and all(.[]; type == "string"))
            and ((has("upgrade_from_previous") | not) or .upgrade_from_previous == "manual")' "$f" >/dev/null \
            || { echo "::error::$f has a placeholder or malformed sha, isn't release $TAG, pins modules apart from the product (marketplace/modules), its notes aren't an array of strings, or it sets upgrade_from_previous to anything but \"manual\""; exit 1; }
      # Product CI already ran every suite on this exact commit: the kernel must be on product main with its `ci-required`
      # check green there (two reads of the commit through the API; nothing fetched runs). Both reads go through
      # gh-get.sh, which retries a transient failure (curl --retry 3 --retry-all-errors: a rate limit, a 5xx, a network
      # error) and then stops the step naming the status and body: an empty answer must never read as "isn't on main" or
      # "not success" and cost this release its tag.
      - name: The kernel is on product main and its CI passed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          repo=$(jq -er '.kernel_repo // "Aiden-HQ/AidenHQ"' "releases/$TAG.json") sha=$(jq -er .kernel "releases/$TAG.json")
          # Each read is its own assignment, guarded: a failed read fails the step here (gh-get names the status and body)
          # instead of dissolving into jq's empty input and then reading as "isn't on main" or "not success", which would
          # cost this release its tag for an API blip.
          compare=$(sh .github/release/gh-get.sh "$GITHUB_API_URL/repos/$repo/compare/$sha...main" compare) \
            || { echo "::error::the compare read of $repo $sha failed (status and body above): not judging the kernel"; exit 1; }
          st=$(printf '%s\n' "$compare" | jq -r .status) \
            || { echo "::error::the compare read of $repo $sha wasn't JSON: $(printf '%s' "$compare" | head -c 300)"; exit 1; }
          # compare base...head reports head relative to base: with base=sha, "ahead" (main is ahead of the sha) or "identical"
          # means the sha is on main; "behind" or "diverged" means it isn't.
          case "$st" in identical|ahead) ;; *) echo "::error::kernel $sha isn't on $repo's main ($st)"; exit 1 ;; esac
          runs=$(sh .github/release/gh-get.sh "$GITHUB_API_URL/repos/$repo/commits/$sha/check-runs?check_name=ci-required&per_page=20" checks) \
            || { echo "::error::the check-runs read of $repo $sha failed (status and body above): not judging its ci-required"; exit 1; }
          ci=$(printf '%s\n' "$runs" \
            | jq -r '(.check_runs // []) | sort_by(.started_at) | last | if . == null then "missing" elif .status != "completed" then "pending" else .conclusion end') \
            || { echo "::error::the check-runs read of $repo $sha wasn't JSON: $(printf '%s' "$runs" | head -c 300)"; exit 1; }
          [ "$ci" = success ] || { echo "::error::$repo's ci-required on $sha is $ci, not success"; exit 1; }
          echo "kernel $sha is on main, ci-required passed"
      # The steps that see the read token: this one (install.sh's fetch and verify, which runs nothing it fetched) and the CI read above.
      - name: Fetch and verify the set (install.sh's own checks)
        env:
          AIDENHQ_GITHUB_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/set"
          sh .github/release/test-set.sh fetch "releases/$TAG.json" "$RUNNER_TEMP/set"
      # Fetched code runs only in the next step, whose environment never has the token, in a job that can't write.
      # The upgrade test (.github/release/upgrade.sh compile): the last graduated release's default install (as its own setup
      # writes it) is pinned to this one by that release's own updater, as a real update does, and must pass this kernel's
      # staged compile. Fetched code, no token. The review of that update by the last release's AI reviewer is its own job.
      - name: The last release's install upgrades to it
        run: env -u AIDENHQ_GITHUB_TOKEN -u GITHUB_TOKEN -u GH_TOKEN -u GIT_CONFIG_COUNT bash .github/release/upgrade.sh compile "$RUNNER_TEMP/set/kernel" "$TAG" "$GITHUB_SHA" "$RUNNER_TEMP/upgrade"

  # The update, filed and reviewed as an install of the last graduated release files it (.github/release/upgrade.sh review):
  # that release's own kernel and AI reviewer, at its exact kernel sha (checked clean before the review), judges it.
  # Advisory: a failure is a warning and doesn't block publish. When it fails, the previous release's installs will likely
  # not update by themselves: the owner may re-cut with `upgrade_from_previous: "manual"` and a first note telling them to
  # run the installer again (INSTALL.md). With that field set the review is skipped.
  # A fresh runner that never runs this release's code: the product repository is only cloned (git reads: its setup.sh, the
  # manifests), the pin is remade by the old updater, and nothing comes from the test job. The only job with
  # GRADUATE_OPENROUTER_KEY (graduation's spend-capped model key).
  review:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: The last release's AI reviewer approves the update
        env:
          OPENROUTER_API_KEY: ${{ secrets.GRADUATE_OPENROUTER_KEY }}
        run: |
          repo=$(jq -er '.kernel_repo // "Aiden-HQ/AidenHQ"' "releases/$TAG.json")
          if git clone -q --no-checkout "https://github.com/$repo.git" "$RUNNER_TEMP/product" \
            && bash .github/release/upgrade.sh review "$RUNNER_TEMP/product" "$TAG" "$GITHUB_SHA" "$RUNNER_TEMP/upgrade"; then
            echo "the last release's AI reviewer approves the update"
          else
            msg="the last release's AI reviewer did not approve the update to $TAG (advisory, publish goes on). The previous release's installs may need to run the installer again: say so in the first release note, or re-cut with upgrade_from_previous \"manual\" (INSTALL.md)."
            echo "::warning::$msg"; echo "### Review warning: $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The images a release builds, from its own product checkout (scripts/release-images.{ts,mjs} list, over its kernel and modules/): the fetched set, as a tarball for the
  # build legs, and their chains (a computer image builds FROM its parent, so a chain builds in order in one leg). A tag
  # run whose file has no `images` stops here (go=false): there is nothing to check.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      go: ${{ steps.has.outputs.go }}
      chains: ${{ steps.list.outputs.chains }}
      todo: ${{ steps.todo.outputs.todo }}
    env:
      REL: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - id: has
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          [[ "$REL" =~ ^[0-9]{4}\.[0-9]{1,2}(\.[0-9]+){0,2}$ ]] || { echo "::error::$REL isn't a release name (2026.11.18, 2026.11.18.1)"; exit 1; }
          f="releases/$REL.json"
          if [ -n "$MANIFEST" ]; then
            [ ! -e "$f" ] || { echo "::error::$f is already on this commit"; exit 1; }
            printf '%s\n' "$MANIFEST" > "$f"
          fi
          [ -f "$f" ] || { echo "::error::no $f"; exit 1; }
          # Shape, where nothing can skip it: no images, or a non-empty map of name -> ghcr.io/aiden-hq/<name>@sha256:<digest>.
          jq -e '(.images // {}) | type == "object" and all(to_entries[]; (.key | test("^[a-z0-9][a-z0-9._-]*$")) and (.value | type == "string" and test("^ghcr\\.io/aiden-hq/[a-z0-9][a-z0-9._-]*@sha256:[0-9a-f]{64}$")))' "$f" >/dev/null \
            || { echo "::error::$f images must map a name to ghcr.io/aiden-hq/<name>@sha256:<digest>"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && ! jq -e '.images | type == "object" and length > 0' "$f" >/dev/null; then
            echo "::notice::$f has no images: this release installs by building them"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch and verify the set (install.sh's own checks)
        if: steps.has.outputs.go == 'true'
        env:
          AIDENHQ_GITHUB_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/set"
          sh .github/release/test-set.sh fetch "releases/$REL.json" "$RUNNER_TEMP/set"
      # No token from here on: this runs the fetched kernel's lister, with its one dependency installed without scripts.
      - id: list
        if: steps.has.outputs.go == 'true'
        run: |
          set="$RUNNER_TEMP/set"
          . .github/release/kpath.sh
          lister=$(kpath "$set/kernel" scripts/release-images.mjs) || { echo "::error::$REL's kernel predates prebuilt images (no scripts/release-images.ts or .mjs)"; exit 1; }
          [ -f "$set/kernel/modules/marketplace.json" ] || { echo "::error::$REL's product has no modules/ (the official modules ship inside it)"; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$set/kernel/scripts"
          chains=$(env -u AIDENHQ_GITHUB_TOKEN node "$lister" list "$set/kernel" "$set/kernel/modules" \
            | jq -c --arg p "$set/kernel/" 'map(map(.context |= ltrimstr($p)))')
          echo "$chains" | jq -e 'length > 0' >/dev/null
          # Build inputs come from the fetched kernel: a name is a plain image name, a context a relative path inside the kernel.
          echo "$chains" | jq -e 'all(.[][]; (.name | test("^[a-z0-9][a-z0-9._-]*$")) and (.context | test("^[A-Za-z0-9._/-]+$") and (startswith("/") | not) and (split("/") | index("..") | not)) and ((.base // "x") | test("^[a-z0-9][a-z0-9._-]*$")))' >/dev/null \
            || { echo "::error::the kernel's image list has an unsafe name or context"; exit 1; }
          for c in $(echo "$chains" | jq -r '.[][].context'); do
            case "$(realpath -e "$set/kernel/$c")" in "$(realpath "$set/kernel")"/*) ;; *) echo "::error::context $c leaves the kernel checkout"; exit 1 ;; esac
          done
          # Each image's content key (image-key.mjs): its build inputs, hashed, once, for every later job.
          chains=$(printf '%s' "$chains" | node .github/release/image-key.mjs "$set/kernel")
          echo "chains=$chains" >> "$GITHUB_OUTPUT"
          echo "$chains" | jq -r '.[][].name' | sort > "$RUNNER_TEMP/names-out.txt"
          cat "$RUNNER_TEMP/names-out.txt"
          tar -C "$set" --exclude=.git --exclude=node_modules -czf "$RUNNER_TEMP/kernel.tgz" kernel
      # The chains with an image the registry has no build of yet, for either platform (public pulls: a miss, even an
      # unreadable package, only means a build). The other chains are reused as they are.
      - id: todo
        if: steps.has.outputs.go == 'true' && github.ref_type != 'tag'
        env:
          CHAINS: ${{ steps.list.outputs.chains }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          todo='[]'
          while read -r chain; do
            missing=0
            for row in $(jq -r '.[] | "\(.name):\(.key)"' <<<"$chain"); do
              for arch in amd64 arm64; do
                docker buildx imagetools inspect "ghcr.io/$owner/${row%%:*}:k-${row##*:}-$arch" >/dev/null 2>&1 || missing=1
              done
            done
            [ "$missing" = 0 ] || todo=$(jq -c --argjson c "$chain" '. + [$c]' <<<"$todo")
          done < <(jq -c '.[]' <<<"$CHAINS")
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
          echo "chains to build: $(jq -r '[.[][].name] | join(" ")' <<<"$todo")"
          echo "images reused: $(jq -n --argjson a "$CHAINS" --argjson t "$todo" '($a | flatten | length) - ($t | flatten | length)') of $(jq '[.[][]] | length' <<<"$CHAINS")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.has.outputs.go == 'true'
        with:
          name: kernel-set
          path: ${{ runner.temp }}/kernel.tgz
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.has.outputs.go == 'true'
        with:
          name: image-names
          path: ${{ runner.temp }}/names-out.txt
          retention-days: 1

  # By hand on a branch or from the nightly, never on a tag: builds what the registry lacks, each platform on its own native
  # runner (one job per chain and platform, in parallel). An image is tagged `k-<key>-<arch>` (its content key, plan) and a
  # hit on that tag is reused, so an unchanged image is never rebuilt. A chain builds in order (a child builds FROM its
  # parent's digest for the same platform).
  images:
    if: github.ref_type != 'tag' && needs.plan.outputs.todo != '[]'
    needs: plan
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        chain: ${{ fromJSON(needs.plan.outputs.todo) }}
        arch: [amd64, arm64]
    env:
      CHAIN: ${{ toJSON(matrix.chain) }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-set
          path: ${{ runner.temp }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the chain for this platform
        run: |
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/kernel.tgz"
          cd "$RUNNER_TEMP/kernel"
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          out='{}'
          # Again, on the unpacked copy, before anything is built.
          jq -e 'all(.[]; (.name | test("^[a-z0-9][a-z0-9._-]*$")) and (.key | test("^[0-9a-f]{32}$")) and (.context | test("^[A-Za-z0-9._/-]+$") and (startswith("/") | not) and (split("/") | index("..") | not)) and ((.base // "x") | test("^[a-z0-9][a-z0-9._-]*$")))' <<<"$CHAIN" >/dev/null \
            || { echo "::error::unsafe image name, key or context"; exit 1; }
          for c in $(jq -r '.[].context' <<<"$CHAIN"); do
            case "$(realpath -e "$c")" in "$PWD"/*) ;; *) echo "::error::context $c leaves the kernel checkout"; exit 1 ;; esac
          done
          for i in $(seq 0 $(( $(jq length <<<"$CHAIN") - 1 ))); do
            name=$(jq -r ".[$i].name" <<<"$CHAIN"); ctx=$(jq -r ".[$i].context" <<<"$CHAIN"); key=$(jq -r ".[$i].key" <<<"$CHAIN")
            parent=$(jq -r ".[$i].base // empty" <<<"$CHAIN")
            base=()
            [ -z "$parent" ] || base=(--build-arg "BASE=$(jq -er --arg p "$parent" '.[$p]' <<<"$out")")
            img="ghcr.io/$owner/$name"; ref="$img:k-$key-$ARCH"
            if digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest); then
              echo "reused $name ($ARCH): $ref"
            else
              docker buildx build --platform "linux/$ARCH" --provenance=false --push -t "$ref" \
                --metadata-file "$RUNNER_TEMP/meta.json" "${base[@]}" "$ctx"
              digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
              echo "built $name ($ARCH): $ref"
            fi
            out=$(jq -c --arg n "$name" --arg r "$img@$digest" '. + {($n): $r}' <<<"$out")
          done

  # One multi-arch image per name: the registry's `k-<key>` if it has one (reused), else the two platforms merged under
  # `k-<key>`. Either way `:<release>` is pointed at it, and the `images` block for releases/<release>.json is every image
  # the plan named, each by the multi-arch digest.
  collect:
    if: ${{ !cancelled() && github.ref_type != 'tag' && needs.plan.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    needs: [plan, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REL: ${{ inputs.release }}
      CHAINS: ${{ needs.plan.outputs.chains }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-names
          path: names
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest; }
          out='{}'
          for row in $(jq -r '.[][] | "\(.name):\(.key)"' <<<"$CHAINS"); do
            name=${row%%:*}; key=${row##*:}; img="ghcr.io/$owner/$name"
            if digest=$(digest_of "$img:k-$key"); then
              docker buildx imagetools create -t "$img:$REL" "$img@$digest"
              echo "reused $name"
            else
              docker buildx imagetools create -t "$img:k-$key" -t "$img:$REL" "$img:k-$key-amd64" "$img:k-$key-arm64"
              digest=$(digest_of "$img:k-$key")
              echo "merged $name"
            fi
            out=$(jq -c --arg n "$name" --arg r "$img@$digest" '. + {($n): $r}' <<<"$out")
          done
          jq -S -n --argjson i "$out" '{ images: $i }' > images.json
          jq -r '.images | keys[]' images.json | cmp - names/names-out.txt || { echo "::error::the built images aren't the planned ones"; exit 1; }
          cat images.json
          { echo "Paste into releases/$REL.json, then tag:"; echo '```json'; cat images.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images.json
          path: images.json

  # A tag run: the file's images are what this release builds, and each digest is there for both platforms (public pulls).
  verify:
    if: github.ref_type == 'tag' && needs.plan.outputs.go == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-names
          path: names
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          f="releases/$TAG.json"
          jq -r '.images | keys[]' "$f" | sort | comm -23 - names/names-out.txt | { ! grep . ; } \
            || { echo "::error::$f names images this release doesn't build (above)"; exit 1; }
          for ref in $(jq -r '.images[]' "$f"); do
            archs=$(docker buildx imagetools inspect --raw "$ref" | jq -r '[.manifests[].platform.architecture] | sort | join(",")')
            [ "$archs" = "amd64,arm64" ] || { echo "::error::$ref has platforms '$archs', not amd64 and arm64 (is the package public?)"; exit 1; }
            echo "ok $ref"
          done

  publish:
    # Fail closed: the shape check ran in plan, and either there are no images to verify or verify passed (never merely not failed).
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.plan.result == 'success' && (needs.plan.outputs.go == 'false' || needs.verify.result == 'success') }}
    needs: [test, review, plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `suites` names what vouches for the kernel (product CI, checked in the test job); deployed updaters require a non-empty list.
      - name: Write tested, bake install.sh
        run: |
          mkdir -p dist
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq --arg run "$run_url" '.tested = { ci_run: $run, suites: ["product-ci"] } | del(.todo)' \
            "releases/$TAG.json" > "dist/$TAG.json"
          digest=$(sha256sum "dist/$TAG.json" | cut -d' ' -f1)
          sed -e "s/^DEFAULT_RELEASE=.*/DEFAULT_RELEASE=$TAG/" -e "s/^RELEASE_SHA256=\"\"/RELEASE_SHA256=\"$digest\"/" \
            -e "s/^RELEASE_COMMIT=\"\"/RELEASE_COMMIT=\"$GITHUB_SHA\"/" install.sh > dist/install.sh
          grep -qx "DEFAULT_RELEASE=$TAG" dist/install.sh && grep -qx "RELEASE_SHA256=\"$digest\"" dist/install.sh \
            && grep -qx "RELEASE_COMMIT=\"$GITHUB_SHA\"" dist/install.sh || { echo "::error::install.sh wasn't baked"; exit 1; }
          [ "$(tail -1 dist/install.sh)" = 'main "$@"' ]
          if command -v shellcheck >/dev/null; then shellcheck dist/install.sh; else echo "shellcheck not on this runner: ci.yml checks the source"; fi
          cat "dist/$TAG.json"
          echo "release file sha256 $digest, distro commit $GITHUB_SHA"
      # The runners have no gh: the REST API with curl. The token goes to curl on stdin (-H @-), never into a file or argv.
      - name: Publish install.sh and the release file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\n' "$GH_TOKEN" | curl -fsS -H @- "$@"; }
          body=$(jq -n --arg t "$TAG" --arg n "Install: \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh | sh\`. Tested: $(jq -c .tested "dist/$TAG.json")" \
            '{ tag_name: $t, name: "AidenHQ \($t)", body: $n, draft: true }')
          id=$(api -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" -d "$body" | jq -er .id)
          for f in install.sh "$TAG.json"; do
            api -X POST -H "Content-Type: application/octet-stream" --data-binary "@dist/$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$f" >/dev/null
          done
          # What was published is what was tested and baked.
          mkdir -p check
          api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$id/assets" | jq -r '.[] | "\(.id) \(.name)"' | while read -r aid name; do
            # Only the octet-stream Accept: with api()'s JSON one too, GitHub answers with the asset's JSON, not its bytes.
            printf 'Authorization: Bearer %s\nAccept: application/octet-stream\n' "$GH_TOKEN" \
              | curl -fsSL -H @- "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$aid" -o "check/$name"
          done
          cmp check/install.sh dist/install.sh && cmp "check/$TAG.json" "dist/$TAG.json"
          # Drafted until here: only a release whose assets passed the checks above is ever published. Published as a
          # pre-release and never latest: it reaches installs and get.aidenhq.ai only when graduate.yml graduates it.
          api -X PATCH "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$id" -d '{"draft": false, "prerelease": true, "make_latest": "false"}' >/dev/null
          echo "published $TAG as a pre-release: graduate.yml graduates it"

  # A published cut starts its graduation: events caused by GITHUB_TOKEN start no workflow except workflow_dispatch, so a
  # workflow_run trigger on graduate.yml never fires for a release the nightly started. No checkout, no candidate code: main's
  # graduate.yml is dispatched by name. graduate's select picks its own candidate, so it takes no inputs; a double start queues.
  graduate:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        # curl, as elsewhere in this file (the token on stdin, never in argv).
        run: |
          printf 'Authorization: Bearer %s\n' "$GH_TOKEN" | curl -fsS --retry 3 -X POST -H @- \
            -H "Accept: application/vnd.github+json" -d '{"ref":"main"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/graduate.yml/dispatches"

  # A published cut closes the failure issues before it (the `alert` job's "Release <name> failed" and the nightly's "Nightly
  # release <name> failed", opened by github-actions). A job of its own: closing never fails the publish. No checkout, no candidate
  # code. Rejected-candidate issues (graduate.yml) are not matched: a human sees those.
  close-alerts:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\n' "$GH_TOKEN" | curl -fsS -H @- "$@"; }
          R="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for n in $(api "$R/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" | jq -r '.[] | select((.pull_request | not) and (.title | test("^(Nightly release|Release) [^ ]+ failed$"))) | .number'); do
            api -X POST "$R/issues/$n/comments" -d "$(jq -n --arg b "A later cut, $TAG, published: $run." '{body: $b}')" >/dev/null
            api -X PATCH "$R/issues/$n" -d '{"state": "closed", "state_reason": "completed"}' >/dev/null
            echo "closed #$n"
          done

  # A tag run that didn't publish leaves no tag (and no draft release), so no install, updater or get.aidenhq.ai ever sees it.
  alert:
    needs: [test, review, plan, verify, publish]
    if: ${{ always() && github.ref_type == 'tag' && needs.publish.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\n' "$GH_TOKEN" | curl -fsS -H @- "$@"; }
          R="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Only a confirmed 404 (no release for this tag) authorizes deleting the tag: a lookup that failed another way
          # says nothing about whether the cut published, and deleting a published release's tag is the worse error. The
          # response status is read, not inferred from api's exit, and a transient failure is retried first.
          code=$(api -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$R/releases/tags/$TAG" 2>/dev/null) || true
          case "${code:-000}" in
            200) title="Release $TAG: its run failed after it was published" body="Release $TAG is published, so its tag stays. Run: $run" ;;
            404)
              for id in $(api "$R/releases?per_page=100" | jq -r --arg t "$TAG" '.[] | select(.draft and .tag_name == $t) | .id'); do api -X DELETE "$R/releases/$id"; done
              # 204/404 means the ref is gone (deleted now, or never there); anything else, or a read that didn't answer,
              # leaves the tag in place and says so, rather than reporting a cleanup that didn't happen.
              dcode=$(api -X DELETE -o /dev/null -w '%{http_code}' "$R/git/refs/tags/$TAG" 2>/dev/null) || true
              case "${dcode:-000}" in
                204|404|0) title="Release $TAG failed" body="Release $TAG didn't pass its install-and-test or publish: its tag is deleted and nothing was released. Run: $run" ;;
                *) title="Release $TAG failed: its tag could not be deleted" body="Release $TAG didn't pass its install-and-test or publish, and it isn't published, but deleting its tag failed (HTTP ${dcode:-no status}). Delete the tag by hand so it can be re-cut. Run: $run" ;;
              esac ;;
            *)
              title="Release $TAG failed: its publication isn't known" body="Release $TAG's run didn't publish, but reading whether a release exists for the tag failed (HTTP ${code:-no status}). Its tag is left in place so a published cut is never deleted: check the run and the tag by hand. Run: $run" ;;
          esac
          api -X POST "$R/issues" -d "$(jq -n --arg t "$title" --arg b "$body" '{title: $t, body: $b}')" | jq -r .html_url
