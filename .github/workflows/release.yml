# Cut a release (lean-core spec §6.8): push a tag `<release>` (2026.11.18, 2026.11.18.1) on a main commit whose
# releases/<release>.json names a real product sha (`kernel`: the product commit, whose modules/ tree is the official
# modules). On GitHub-hosted runners, this installs exactly that set (install.sh's own fetch and verify), runs the release suites on it, writes `tested`, bakes the file's sha256 and the tag's commit into install.sh, and
# publishes both as the release's assets: https://github.com/Aiden-HQ/aidenhq-distro/releases/download/<release>/install.sh.
# Prebuilt images: the release file may carry `images` (name -> ghcr.io/aiden-hq/<name>@sha256:<digest>), which apply pulls
# instead of building. The apply reads the release file from git at the pinned commit, so the digests are in the file before
# the tag: run this workflow by hand first (Actions > release > Run workflow, release = the name), which builds every image
# the release's product checkout (its kernel and its modules/) builds locally for amd64 and arm64, pushes them, and prints the `images` block (and keeps it
# as the `images.json` artifact) to paste into releases/<release>.json. The tag run then checks that each digest is there for
# both platforms and names an image this release builds. A release file without `images` installs by building, as before.
# RELEASE_READ_TOKEN (contents: read) is optional: only a private product repo needs it; public repos fetch
# anonymously, and an unset secret gives the fetch no token.
# A tag run is a push of the tag, or this workflow dispatched on the tag (Run workflow, "Use workflow from" = the tag; the
# nightly does this, since a tag it pushes with GITHUB_TOKEN starts no workflow). Any other run builds images.
# The nightly (nightly.yml) calls this workflow (workflow_call) for plan/images/collect with its release file as `manifest`,
# then lands the file with the images on main, tags it and dispatches the tag run.
# A tag run that doesn't publish deletes its tag and any draft release, and opens an issue (`alert`), so installs never see an
# untested release. get.aidenhq.ai serves the latest published release's install.sh (web/worker.js): publishing is going live.
# Isolation: the test job's suites step is the only one that runs fetched code, and it has no token; publish is a separate
# job (needs: test), so it lands on a fresh runner that never ran the suites.
name: release
on:
  push:
    tags: ["20[0-9][0-9].[0-9]*"]
  workflow_dispatch:
    inputs:
      release:
        description: "On a branch: build and push the images of releases/<name>.json (e.g. 2026.11.18). On a tag: leave empty, the tag is the release."
        required: false
  workflow_call:
    inputs:
      release:
        type: string
        required: true
      # The release file itself, when it isn't on this commit yet (the nightly's).
      manifest:
        type: string
        required: false
    secrets:
      RELEASE_READ_TOKEN:
        required: false
permissions: {}
concurrency: release-${{ github.ref_type == 'tag' && github.ref_name || inputs.release }}-${{ github.ref_type }}
jobs:
  # Fetch and test with a read-only token; publishing is a separate job, the only one that can write.
  test:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Node 24 is in the runner image's tool cache: found there, nothing is downloaded.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: The tag is on main and its release file names a real product sha
        run: |
          [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{1,2}(\.[0-9]+){0,2}$ ]] || { echo "::error::$TAG isn't a release name (2026.11.18, 2026.11.18.1)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG isn't on main"; exit 1; }
          f="releases/$TAG.json"
          [ -f "$f" ] || { echo "::error::no $f"; exit 1; }
          jq -e --arg t "$TAG" '
            def sha: type == "string" and test("^[0-9a-f]{40}$");
            .release == $t and (.kernel | sha) and ((.kernel_repo // "x/y") | type == "string" and test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"))
            and (has("marketplace") or has("modules") | not)
            and ((.notes // []) | type == "array" and length <= 20 and all(.[]; type == "string" and length <= 300))' "$f" >/dev/null \
            || { echo "::error::$f has a placeholder or malformed sha, isn't release $TAG, pins modules apart from the product (marketplace/modules), or its notes aren't up to 20 lines of text"; exit 1; }
      # The only step that sees the read token: install.sh's fetch and verify, which runs nothing it fetched.
      - name: Fetch and verify the set (install.sh's own checks)
        env:
          AIDENHQ_GITHUB_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/set"
          sh .github/release/test-set.sh fetch "releases/$TAG.json" "$RUNNER_TEMP/set"
      # Fetched code runs only here: a separate step whose environment never has the token (unset again to be sure;
      # test-set.sh refuses to run the suites if any credential is set), in a job that can't write.
      - name: Run the release suites on it
        id: suites
        run: |
          env -u AIDENHQ_GITHUB_TOKEN -u GITHUB_TOKEN -u GH_TOKEN -u GIT_CONFIG_COUNT sh .github/release/test-set.sh suites "$RUNNER_TEMP/set"
          jq -e 'type == "array" and all(.[]; IN("kernel-only", "swap", "parity", "adversarial", "twin"))' "$RUNNER_TEMP/set/suites.json"
          echo "suites=$(jq -c . "$RUNNER_TEMP/set/suites.json")" >> "$GITHUB_OUTPUT"

  # The images a release builds, from its own product checkout (scripts/release-images.mjs list, over its kernel and modules/): the fetched set, as a tarball for the
  # build legs, and their chains (a computer image builds FROM its parent, so a chain builds in order in one leg). A tag
  # run whose file has no `images` stops here (go=false): there is nothing to check.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      go: ${{ steps.has.outputs.go }}
      chains: ${{ steps.list.outputs.chains }}
    env:
      REL: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - id: has
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          [[ "$REL" =~ ^[0-9]{4}\.[0-9]{1,2}(\.[0-9]+){0,2}$ ]] || { echo "::error::$REL isn't a release name (2026.11.18, 2026.11.18.1)"; exit 1; }
          f="releases/$REL.json"
          if [ -n "$MANIFEST" ]; then
            [ ! -e "$f" ] || { echo "::error::$f is already on this commit"; exit 1; }
            printf '%s\n' "$MANIFEST" > "$f"
          fi
          [ -f "$f" ] || { echo "::error::no $f"; exit 1; }
          # Shape, where nothing can skip it: no images, or a non-empty map of name -> ghcr.io/aiden-hq/<name>@sha256:<digest>.
          jq -e '(.images // {}) | type == "object" and all(to_entries[]; (.key | test("^[a-z0-9][a-z0-9._-]*$")) and (.value | type == "string" and test("^ghcr\\.io/aiden-hq/[a-z0-9][a-z0-9._-]*@sha256:[0-9a-f]{64}$")))' "$f" >/dev/null \
            || { echo "::error::$f images must map a name to ghcr.io/aiden-hq/<name>@sha256:<digest>"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && ! jq -e '.images | type == "object" and length > 0' "$f" >/dev/null; then
            echo "::notice::$f has no images: this release installs by building them"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch and verify the set (install.sh's own checks)
        if: steps.has.outputs.go == 'true'
        env:
          AIDENHQ_GITHUB_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/set"
          sh .github/release/test-set.sh fetch "releases/$REL.json" "$RUNNER_TEMP/set"
      # No token from here on: this runs the fetched kernel's lister, with its one dependency installed without scripts.
      - id: list
        if: steps.has.outputs.go == 'true'
        run: |
          set="$RUNNER_TEMP/set"
          [ -f "$set/kernel/scripts/release-images.mjs" ] || { echo "::error::$REL's kernel predates prebuilt images (no scripts/release-images.mjs)"; exit 1; }
          [ -f "$set/kernel/modules/marketplace.json" ] || { echo "::error::$REL's product has no modules/ (the official modules ship inside it)"; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$set/kernel/scripts"
          chains=$(env -u AIDENHQ_GITHUB_TOKEN node "$set/kernel/scripts/release-images.mjs" list "$set/kernel" "$set/kernel/modules" \
            | jq -c --arg p "$set/kernel/" 'map(map(.context |= ltrimstr($p)))')
          echo "$chains" | jq -e 'length > 0' >/dev/null
          # Build inputs come from the fetched kernel: a name is a plain image name, a context a relative path inside the kernel.
          echo "$chains" | jq -e 'all(.[][]; (.name | test("^[a-z0-9][a-z0-9._-]*$")) and (.context | test("^[A-Za-z0-9._/-]+$") and (startswith("/") | not) and (split("/") | index("..") | not)) and ((.base // "x") | test("^[a-z0-9][a-z0-9._-]*$")))' >/dev/null \
            || { echo "::error::the kernel's image list has an unsafe name or context"; exit 1; }
          for c in $(echo "$chains" | jq -r '.[][].context'); do
            case "$(realpath -e "$set/kernel/$c")" in "$(realpath "$set/kernel")"/*) ;; *) echo "::error::context $c leaves the kernel checkout"; exit 1 ;; esac
          done
          echo "chains=$chains" >> "$GITHUB_OUTPUT"
          echo "$chains" | jq -r '.[][].name' | sort > "$RUNNER_TEMP/names-out.txt"
          cat "$RUNNER_TEMP/names-out.txt"
          tar -C "$set" --exclude=.git --exclude=node_modules -czf "$RUNNER_TEMP/kernel.tgz" kernel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.has.outputs.go == 'true'
        with:
          name: kernel-set
          path: ${{ runner.temp }}/kernel.tgz
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.has.outputs.go == 'true'
        with:
          name: image-names
          path: ${{ runner.temp }}/names-out.txt
          retention-days: 1

  # By hand on a branch or from the nightly, never on a tag: builds and pushes every chain for amd64 and arm64 (one job per chain, in parallel).
  images:
    if: github.ref_type != 'tag'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        chain: ${{ fromJSON(needs.plan.outputs.chains) }}
    env:
      REL: ${{ inputs.release }}
      CHAIN: ${{ toJSON(matrix.chain) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-set
          path: ${{ runner.temp }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the chain
        run: |
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/kernel.tgz"
          cd "$RUNNER_TEMP/kernel"
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          out='{}'
          # Again, on the unpacked copy, before anything is built.
          jq -e 'all(.[]; (.name | test("^[a-z0-9][a-z0-9._-]*$")) and (.context | test("^[A-Za-z0-9._/-]+$") and (startswith("/") | not) and (split("/") | index("..") | not)) and ((.base // "x") | test("^[a-z0-9][a-z0-9._-]*$")))' <<<"$CHAIN" >/dev/null \
            || { echo "::error::unsafe image name or context"; exit 1; }
          for c in $(jq -r '.[].context' <<<"$CHAIN"); do
            case "$(realpath -e "$c")" in "$PWD"/*) ;; *) echo "::error::context $c leaves the kernel checkout"; exit 1 ;; esac
          done
          for i in $(seq 0 $(( $(jq length <<<"$CHAIN") - 1 ))); do
            name=$(jq -r ".[$i].name" <<<"$CHAIN"); ctx=$(jq -r ".[$i].context" <<<"$CHAIN"); parent=$(jq -r ".[$i].base // empty" <<<"$CHAIN")
            base=()
            [ -z "$parent" ] || base=(--build-arg "BASE=$(jq -er --arg p "$parent" '.[$p]' <<<"$out")")
            img="ghcr.io/$owner/$name"
            docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --push -t "$img:$REL" \
              --metadata-file "$RUNNER_TEMP/meta.json" "${base[@]}" "$ctx"
            digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
            out=$(jq -c --arg n "$name" --arg r "$img@$digest" '. + {($n): $r}' <<<"$out")
            echo "$name -> $img@$digest"
          done
          echo "$out" > "$RUNNER_TEMP/images-part.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ matrix.chain[0].name }}
          path: ${{ runner.temp }}/images-part.json
          retention-days: 7

  # The `images` block for releases/<release>.json: every image the plan named, each by digest.
  collect:
    needs: [plan, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: images-*
          merge-multiple: false
          path: parts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-names
          path: names
      - run: |
          jq -S -s '{ images: (map(.) | add) }' parts/*/images-part.json > images.json
          jq -r '.images | keys[]' images.json | cmp - names/names-out.txt || { echo "::error::the built images aren't the planned ones"; exit 1; }
          cat images.json
          { echo "Paste into releases/$REL.json, then tag:"; echo '```json'; cat images.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          REL: ${{ inputs.release }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images.json
          path: images.json

  # A tag run: the file's images are what this release builds, and each digest is there for both platforms (public pulls).
  verify:
    if: github.ref_type == 'tag' && needs.plan.outputs.go == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-names
          path: names
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          f="releases/$TAG.json"
          jq -r '.images | keys[]' "$f" | sort | comm -23 - names/names-out.txt | { ! grep . ; } \
            || { echo "::error::$f names images this release doesn't build (above)"; exit 1; }
          for ref in $(jq -r '.images[]' "$f"); do
            archs=$(docker buildx imagetools inspect --raw "$ref" | jq -r '[.manifests[].platform.architecture] | sort | join(",")')
            [ "$archs" = "amd64,arm64" ] || { echo "::error::$ref has platforms '$archs', not amd64 and arm64 (is the package public?)"; exit 1; }
            echo "ok $ref"
          done

  publish:
    # Fail closed: the shape check ran in plan, and either there are no images to verify or verify passed (never merely not failed).
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.plan.result == 'success' && (needs.plan.outputs.go == 'false' || needs.verify.result == 'success') }}
    needs: [test, plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      SUITES: ${{ needs.test.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write tested, bake install.sh
        run: |
          mkdir -p dist
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq --arg run "$run_url" --argjson s "$SUITES" '.tested = { ci_run: $run, suites: $s } | del(.todo)' \
            "releases/$TAG.json" > "dist/$TAG.json"
          digest=$(sha256sum "dist/$TAG.json" | cut -d' ' -f1)
          sed -e "s/^DEFAULT_RELEASE=.*/DEFAULT_RELEASE=$TAG/" -e "s/^RELEASE_SHA256=\"\"/RELEASE_SHA256=\"$digest\"/" \
            -e "s/^RELEASE_COMMIT=\"\"/RELEASE_COMMIT=\"$GITHUB_SHA\"/" install.sh > dist/install.sh
          grep -qx "DEFAULT_RELEASE=$TAG" dist/install.sh && grep -qx "RELEASE_SHA256=\"$digest\"" dist/install.sh \
            && grep -qx "RELEASE_COMMIT=\"$GITHUB_SHA\"" dist/install.sh || { echo "::error::install.sh wasn't baked"; exit 1; }
          [ "$(tail -1 dist/install.sh)" = 'main "$@"' ]
          if command -v shellcheck >/dev/null; then shellcheck dist/install.sh; else echo "shellcheck not on this runner: ci.yml checks the source"; fi
          cat "dist/$TAG.json"
          echo "release file sha256 $digest, distro commit $GITHUB_SHA"
      # The runners have no gh: the REST API with curl. The token goes to curl on stdin (-H @-), never into a file or argv.
      - name: Publish install.sh and the release file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\n' "$GH_TOKEN" | curl -fsS -H @- "$@"; }
          body=$(jq -n --arg t "$TAG" --arg n "Install: \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh | sh\`. Tested: $(jq -c .tested "dist/$TAG.json")" \
            '{ tag_name: $t, name: "AidenHQ \($t)", body: $n, draft: true }')
          id=$(api -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" -d "$body" | jq -er .id)
          for f in install.sh "$TAG.json"; do
            api -X POST -H "Content-Type: application/octet-stream" --data-binary "@dist/$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$f" >/dev/null
          done
          # What was published is what was tested and baked.
          mkdir -p check
          api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$id/assets" | jq -r '.[] | "\(.id) \(.name)"' | while read -r aid name; do
            # Only the octet-stream Accept: with api()'s JSON one too, GitHub answers with the asset's JSON, not its bytes.
            printf 'Authorization: Bearer %s\nAccept: application/octet-stream\n' "$GH_TOKEN" \
              | curl -fsSL -H @- "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$aid" -o "check/$name"
          done
          cmp check/install.sh dist/install.sh && cmp "check/$TAG.json" "dist/$TAG.json"
          # Drafted until here: only a release whose assets passed the checks above is ever published.
          # It becomes "latest" (what get.aidenhq.ai serves) only when no published release has a newer name: a draft or a deleted
          # failed release never is, and a re-run of an older tag doesn't move the site back.
          newest=$( { api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -r '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name'; echo "$TAG"; } \
            | grep -E '^[0-9]{4}\.[0-9]{1,2}(\.[0-9]+){0,2}$' | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n | tail -1)
          latest=false; [ "$newest" != "$TAG" ] || latest=true
          api -X PATCH "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$id" -d "$(jq -n --arg l "$latest" '{draft: false, prerelease: false, make_latest: $l}')" >/dev/null
          echo "published $TAG (latest: $latest)"

  # A tag run that didn't publish leaves no tag (and no draft release), so no install, updater or get.aidenhq.ai ever sees it.
  alert:
    needs: [test, plan, verify, publish]
    if: ${{ always() && github.ref_type == 'tag' && needs.publish.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\n' "$GH_TOKEN" | curl -fsS -H @- "$@"; }
          R="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if api "$R/releases/tags/$TAG" >/dev/null 2>&1; then
            title="Release $TAG: its run failed after it was published" body="Release $TAG is published, so its tag stays. Run: $run"
          else
            for id in $(api "$R/releases?per_page=100" | jq -r --arg t "$TAG" '.[] | select(.draft and .tag_name == $t) | .id'); do api -X DELETE "$R/releases/$id"; done
            api -X DELETE "$R/git/refs/tags/$TAG" || echo "tag $TAG is already gone"
            title="Release $TAG failed" body="Release $TAG didn't pass its install-and-test or publish: its tag is deleted and nothing was released. Run: $run"
          fi
          api -X POST "$R/issues" -d "$(jq -n --arg t "$title" --arg b "$body" '{title: $t, body: $b}')" | jq -r .html_url
